version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: proof_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proof_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-proof_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-proof_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proof_user -d proof_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: proof_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://proof_user:proof_secure_pass@db:5432/proof_db
      SECRET_KEY: ${SECRET_KEY:-proof_production_secret_key_super_secure_2026}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: proof_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
